name: pramaan
description: "PRAMAAN - AI-Powered Document & Identity Authentication for Border Checkpoints"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & Scanning
  camera: ^0.11.1
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2

  # QR Code
  qr_flutter: ^4.1.0

  # ML Kit Face Detection
  google_mlkit_face_detection: ^0.11.0

  # Crypto
  cryptography: ^2.7.0
  crypto: ^3.0.3
  pointycastle: ^3.9.1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Image Processing
  image: ^4.2.0

  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  fl_chart: ^0.69.0
  animations: ^2.0.11
  flutter_animate: ^4.5.0

  # Utils
  uuid: ^4.4.2
  intl: ^0.19.0
  permission_handler: ^11.3.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
